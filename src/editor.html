<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机 Office 工作台</title><style>*{box-sizing:border-box}body{margin:0;font:13px system-ui;background:#f7f8fa;color:#273142}header{height:52px;display:flex;gap:16px;align-items:center;padding:0 18px;border-bottom:1px solid #dfe3e8;background:white}strong{max-width:35%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}span{flex:1;color:#697586}button{background:#176b57;border:0;color:white;border-radius:6px;padding:8px 16px;cursor:pointer}button:disabled{opacity:.5}#workspace{height:calc(100vh - 82px)}#workspace iframe{height:100%;width:100%;border:0}#note{height:30px;padding:5px 18px;color:#667085;background:white}#error{position:absolute;top:52px;left:0;right:0;z-index:10;background:#fff2d8;padding:12px;display:none}</style></head><body><header><strong id="title">正在打开文件</strong><span id="status">连接本机编辑器…</span><button id="save" disabled>保存到文件</button></header><div id="error"></div><div id="workspace"><div id="frame"></div></div><div id="note">文件在本机处理 · 保存前保留版本</div><script src="http://127.0.0.1:43232/web-apps/apps/api/documents/api.js"></script><script>
const id=location.pathname.split('/').pop(),token=location.hash.slice(1),native=new URLSearchParams(location.search).get('native')==='1',bridge=new URLSearchParams(location.search).get('bridge')==='1';
const $=id=>document.getElementById(id);let ready=false,dirty=false,revision=0,lastCommitted=0,busy=false,editGeneration=0;
const emit=(type,data={})=>{if(native)parent.postMessage({officeLocal:true,id,type,...data},'*');};
const fail=e=>{$('error').style.display='block';$('error').textContent=e.message||String(e);$('status').textContent='尚未保存到文件';};
async function api(op,method='GET'){const r=await fetch('/api/'+op+'/'+id,{method,headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
function savedStatus(r,g){lastCommitted=r;if(g!==null&&g===editGeneration)dirty=false;$('error').style.display='none';$('status').textContent=dirty?'上一版本已保存，仍有新修改待保存':'已保存到本地原文件 · '+new Date().toLocaleTimeString();}
async function persist(r,g=null){if(r<=lastCommitted)return;if(bridge){$('status').textContent='修改已保留在本机，等待写回原文件…';for(let i=0;i<60;i++){const s=await api('status');if(s.hostError)throw Error(s.hostError);if(s.hostSavedRevision>=r){savedStatus(r,g);return;}await new Promise(r=>setTimeout(r,500));}throw Error('尚未写回原文件，请保持文件连接标签页打开。修改已保留在本机。');}if(native){emit('revision',{revision:r});return;}const result=await api('commit','POST');if(result.outcome==='conflict')throw Error('原文件已被其他窗口修改，已阻止覆盖。当前编辑已保留在本机历史版本中。');savedStatus(r,g);}
async function save(){if(!ready||busy)return;busy=true;const savingGeneration=editGeneration;$('save').disabled=true;$('status').textContent='正在写入文件…';try{let result=await api('force','POST');for(let retry=0;result.noChanges&&dirty&&retry<8;retry++){await new Promise(r=>setTimeout(r,750));result=await api('force','POST');}let s;for(let i=0;i<60;i++){s=await api('status');if(s.error)throw Error(s.error);if(s.revision>result.start||result.noChanges)break;await new Promise(r=>setTimeout(r,500));}if(!result.noChanges&&s.revision<=result.start)throw Error('保存超时，请稍后重试。不要关闭此标签页。');if(result.noChanges&&dirty&&s.revision<=lastCommitted)throw Error('编辑器正在同步刚输入的内容，请稍后再点保存。');await persist(s.revision,savingGeneration);if(!s.revision&&!dirty)$('status').textContent='文件没有新修改';}catch(e){fail(e);}finally{busy=false;$('save').disabled=false;}}
window.addEventListener('message',e=>{if(e.source!==parent||!e.data?.officeHost)return;if(e.data.type==='saved'){lastCommitted=e.data.revision;dirty=false;$('status').textContent='已保存到文件 · '+new Date().toLocaleTimeString();$('error').style.display='none';}if(e.data.type==='error')fail(Error(e.data.message));});
$('save').onclick=save;
(async()=>{const c=await api('config');$('title').textContent=c.document.title;c.events={onDocumentReady(){ready=true;$('save').disabled=false;$('status').textContent='可以编辑 · 修改后请保存';emit('ready');},onDocumentStateChange(e){if(e.data){dirty=true;editGeneration++;}if(dirty)$('status').textContent='正在编辑 · 请保存到文件';emit('dirty',{dirty});},onError(e){fail(Error(e.data?.errorDescription||'编辑器发生错误'));}};window.officeEditor=new DocsAPI.DocEditor('frame',c);})().catch(fail);
setInterval(async()=>{if(!ready||busy)return;try{const s=await api('status');if(s.revision>lastCommitted){busy=true;try{await persist(s.revision);}finally{busy=false;}}}catch(e){fail(e);}},1500);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
</script></body></html>
